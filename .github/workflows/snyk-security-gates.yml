
name: Snyk Security Gates

on:
  push:
    branches:
      - test-scenario-1
      - main
  pull_request:
    branches:
      - main
      - test-scenario-1
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Snyk Security Scans
    runs-on: ubuntu-latest

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_API: https://api.au.snyk.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Verify Snyk authentication
        run: snyk --version && snyk auth $SNYK_TOKEN

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
        
        #Gate 1
      - name: Snyk Code - SAST
        id: code
        continue-on-error: true
        run: |
          snyk code test --severity-threshold=high \
            --sarif-file-output=snyk-code.sarif

        #Gate 2
      - name: Snyk Open Source - SCA
        id: sca
        continue-on-error: true
        run: |
          snyk test --file=requirements.txt \
            --severity-threshold=high \
            --sarif-file-output=snyk-sca.sarif

        #Gate 1 results
      - name: Upload Snyk Code results
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

        #Gate 2 results
      - name: Upload Snyk Open Source results
        if: always() && hashFiles('snyk-sca.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-open-source

      - name: Publish Open Source snapshot to Snyk
        if: always()
        continue-on-error: true
        run: snyk monitor --file=requirements.txt

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-security-reports
          path: |
            snyk-code.sarif
            snyk-sca.sarif
          if-no-files-found: warn

      - name: Enforce security gates
        if: always()
        env:
          CODE_RESULT: ${{ steps.code.outcome }}
          SCA_RESULT: ${{ steps.sca.outcome }}
        run: |
          failed=0

          if [ "$CODE_RESULT" != "success" ]; then
            echo "❌ SAST gate failed: High or Critical findings, or scan error."
            failed=1
          else
            echo "✅ SAST gate passed."
          fi

          if [ "$SCA_RESULT" != "success" ]; then
            echo "❌ SCA gate failed: High or Critical findings, or scan error."
            failed=1
          else
            echo "✅ SCA gate passed."
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
